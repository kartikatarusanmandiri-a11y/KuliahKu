name: Build KuliahKu APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KuliahKu_APK_Project_LAYAR_UTAMA_NOTIFIKASI.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o "KuliahKu_APK_Project_LAYAR_UTAMA_NOTIFIKASI.zip" -d project

      - name: Check Android project
        run: |
          echo "Isi project:"
          find project -maxdepth 4 -type f | sort | head -200

          if [ -f "project/settings.gradle" ] && [ -f "project/build.gradle" ]; then
            echo "Project Android ditemukan."
          else
            echo "ERROR: File project Android tidak lengkap."
            exit 1
          fi

      - name: Create Gradle Wrapper
        working-directory: project
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK
        working-directory: project
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK yang dihasilkan:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuliahKu-APK
          path: project/**/*.apk
          if-no-files-found: error
